<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Site Error</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #202124;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    .sad-tab-icon {
      width: 36px;
      height: 48px;
      border: 2px solid #9aa0a6;
      border-radius: 2px;
      position: relative;
      margin-bottom: 30px;
    }

    .sad-tab-icon::before {
      content: '';
      position: absolute;
      top: 6px;
      right: 4px;
      width: 2px;
      height: 2px;
      background: #9aa0a6;
      box-shadow: -14px 0 #9aa0a6;
    }

    .sad-tab-icon::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 7px;
      width: 14px;
      height: 6px;
      border-top: 2px solid #9aa0a6;
      border-radius: 50% 50% 0 0;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #e8eaed;
      margin-bottom: 16px;
    }

    .message {
      font-size: 15px;
      color: #9aa0a6;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .message strong {
      color: #e8eaed;
    }

    .try-section {
      font-size: 15px;
      color: #9aa0a6;
      margin-bottom: 24px;
    }

    .try-section p {
      margin-bottom: 8px;
    }

    .try-section ul {
      list-style-type: disc;
      padding-left: 20px;
    }

    .try-section li {
      margin-bottom: 6px;
    }

    .try-section a {
      color: #8ab4f8;
      text-decoration: none;
    }

    .try-section a:hover {
      text-decoration: underline;
    }

    .error-code {
      font-size: 12px;
      color: #9aa0a6;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-details {
      background: transparent;
      border: 1px solid #5f6368;
      color: #8ab4f8;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-details:hover {
      background: rgba(138, 180, 248, 0.04);
    }

    .btn-reload {
      background-color: #8ab4f8;
      border: none;
      color: #202124;
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-reload:hover {
      background-color: #9bbbe9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sad-tab-icon"></div>
    
    <h1>This site can’t be reached</h1>
    
    <div class="message">
      <strong id="domain-name">example.com</strong>’s server IP address could not be found.
    </div>

    <div class="try-section">
      <p>Try:</p>
      <ul>
        <li>Checking the connection</li>
        <li><a href="#">Checking the proxy, firewall, and DNS configuration</a></li>
        <li><a href="#">Running Connectivity Diagnostics</a></li>
      </ul>
    </div>

    <div class="error-code">ERR_NAME_NOT_RESOLVED</div>

    <div class="buttons">
      <button class="btn-details" id="detailsBtn">Details</button>
      <button class="btn-reload" id="reloadBtn">Reload</button>
    </div>
  </div>

  <script>
    // Extract domain dynamically
    function getDynamicDomain() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // Option 1: Pass custom domain via URL query parameter (e.g. ?domain=mysite.com)
      if (urlParams.has('domain')) {
        return urlParams.get('domain');
      }
      
      // Option 2: Fallback to current website hostname (or default fallback if local)
      return window.location.hostname || "example.com";
    }

    // Set dynamic values on page load
    const currentDomain = getDynamicDomain();
    document.getElementById('domain-name').textContent = currentDomain;
    document.getElementById('page-title').textContent = currentDomain;

    // Interactive buttons
    document.getElementById('reloadBtn').addEventListener('click', () => {
      window.location.reload();
    });

    document.getElementById('detailsBtn').addEventListener('click', () => {
      alert(`Error details for ${currentDomain}: ERR_NAME_NOT_RESOLVED`);
    });
  </script>
</body>
</html>
